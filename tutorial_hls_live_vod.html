    <article class="card">
        <h1>HLS 直播与点播差异</h1>
        <p>理解直播和点播差异，有助于定位“为什么同一播放器在两种流上表现不一样”。</p>
        <h2>点播（VOD）</h2>
        <p>通常有 <code>#EXT-X-ENDLIST</code>，清单稳定不变，适合预加载和快进回退。</p>
        <h2>直播（Live）</h2>
        <p>清单会持续刷新，<code>MEDIA-SEQUENCE</code> 递增，播放器需要不断拉取最新分片。</p>
        <h2>常见问题差异</h2>
        <p>直播更容易出现延迟累积、追帧失败和断流；点播更常见是某个片段损坏导致进度卡住。</p>
    </article>
</main>
