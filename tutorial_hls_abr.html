    <article class="card">
        <h1>HLS 自适应码率（ABR）原理</h1>
        <p>ABR 的目标不是“永远最清晰”，而是在当前网络条件下保证尽可能连续播放。</p>
        <h2>基本机制</h2>
        <p>播放器根据近期下载速度估算带宽，在主清单中选择合适码率的子清单拉取分片。</p>
        <h2>为什么会突然变模糊</h2>
        <p>当网络抖动时，播放器会主动降码率避免卡顿；网络恢复后再逐步升码率。</p>
        <h2>优化建议</h2>
        <p>多码率档位间差距不要过大；分片时长保持稳定；避免频繁切换带来的观感抖动。</p>
    </article>
