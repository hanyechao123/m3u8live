<body>
    <header class="hd">
        <div class="link-list">
            <span class="brand">M3U8 Player</span>

        </div>
    </header>

    <main class="main">
        <section class="hero">
            <h1>M3U8 转 MP4</h1>
            <p>粘贴 M3U8 链接后在服务端转码并下载 MP4。</p>
        </section>

        <section class="card">
            <label for="source-url">M3U8 链接</label>
            <div class="form">
                <input id="source-url" type="text" value="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" placeholder="请输入 M3U8 地址（如：https://xxx.m3u8）">
                <button id="convert-btn" class="btn" type="button">开始转换</button>
            </div>
            <div class="form-bottom">
                <label for="profile">转码模式</label>
                <select id="profile" class="mode-select">
                    <option value="fast">极速（480p，推荐）</option>
                    <option value="balanced">兼容（较慢，画质更好）</option>
                </select>
            </div>
            <div class="progress"><div id="progress-bar"></div></div>
            <div class="status" id="status-text">待开始</div>
            <div class="tips">
                <div>1. 极速模式会降分辨率到 480p，明显更快。</div>
                <div>2. 转码在服务器端完成，请耐心等待任务处理。</div>
                <div>3. 如遇失败，请检查源链接是否可访问、是否带鉴权参数。</div>
            </div>
        </section>
    </main>

    <div class="main" style="padding-top: 0;">
        <div class="footer" style="font-size: 13px; color: var(--muted);">
            <div>© 2026 m3u8live.cn - 仅限个人非商用使用</div>
            <div class="links" style="margin-top: 8px;">
                <a href="/about.html">关于</a>

                <a href="/terms.html">服务条款</a>

            </div>
        </div>
    </div>

    <script>
        let isConverting = false;
        const sourceInput = document.getElementById('source-url');
        const convertBtn = document.getElementById('convert-btn');
        const profileEl = document.getElementById('profile');
        const statusText = document.getElementById('status-text');
        const progressBar = document.getElementById('progress-bar');

        function setStatus(text, ratio) {
            statusText.textContent = text;
            if (typeof ratio === 'number') {
                const val = Math.max(0, Math.min(1, ratio));
                progressBar.style.width = `${(val * 100).toFixed(1)}%`;
            }
        }

        function setBusy(busy) {
            isConverting = busy;
            convertBtn.disabled = busy;
            convertBtn.textContent = busy ? '转换中...' : '开始转换';
        }

        function ensureM3U8(url) {
            if (!url) return false;
            const normalized = url.trim().toLowerCase();
            return normalized.startsWith('http') && normalized.includes('.m3u8');
        }

        function triggerDownload(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 3000);
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function waitForJob(jobId) {
            let pseudo = 0.2;
            while (true) {
                const res = await fetch(`/api/convert/${jobId}/status`, { method: 'GET' });
                if (!res.ok) {
                    const text = await res.text();
                    if (res.status === 404 || (text && text.includes('任务不存在或已过期'))) {
                        throw new Error('JOB_EXPIRED');
                    }
                    throw new Error(text || `状态查询失败: HTTP ${res.status}`);
                }
                const job = await res.json();
                if (job.status === 'done') {
                    setStatus('转码完成，准备下载...', 0.96);
                    return;
                }
                if (job.status === 'error') {
                    throw new Error(job.error || '转码失败');
                }
                pseudo = Math.min(0.9, pseudo + 0.03);
                setStatus('服务端转码中，请稍候...', pseudo);
                await sleep(2000);
            }
        }

        async function convert() {
            if (isConverting) return;
            const sourceUrl = sourceInput.value.trim();
            const profile = profileEl.value === 'balanced' ? 'balanced' : 'fast';
            if (!ensureM3U8(sourceUrl)) {
                setStatus('请输入有效的 M3U8 链接（以 .m3u8 结尾）', 0);
                return;
            }

            try {
                setBusy(true);
                setStatus('正在提交后端转码任务...', 0.15);
                const res = await fetch('/api/convert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: sourceUrl, profile })
                });
                if (!res.ok) {
                    const text = await res.text();
                    throw new Error(text || `HTTP ${res.status}`);
                }
                const data = await res.json();
                if (!data.jobId) throw new Error('后端未返回任务ID');

                await waitForJob(data.jobId);
                const downloadRes = await fetch(`/api/convert/${data.jobId}/download`, { method: 'GET' });
                if (!downloadRes.ok) {
                    const text = await downloadRes.text();
                    if (downloadRes.status === 404 || (text && text.includes('任务不存在或已过期'))) {
                        throw new Error('JOB_EXPIRED');
                    }
                    throw new Error(text || `下载失败: HTTP ${downloadRes.status}`);
                }
                const blob = await downloadRes.blob();
                triggerDownload(blob, `m3u8_to_mp4_${Date.now()}.mp4`);
                setStatus('转换完成，已开始下载', 1);
            } catch (error) {
                const msg = String(error && error.message ? error.message : error);
                if (msg.includes('JOB_EXPIRED')) {
                    setStatus('任务超时，请重新提交', 0);
                } else if (msg.includes('Failed to fetch') || msg.includes('ERR_NETWORK_IO_SUSPENDED')) {
                    setStatus('转换失败：网络连接中断。请保持页面前台、关闭系统休眠后重试。', 0);
                } else {
                    setStatus(`转换失败：${msg}`, 0);
                }
                console.error(error);
            } finally {
                setBusy(false);
            }
        }

        convertBtn.addEventListener('click', convert);
        sourceInput.addEventListener('click', () => sourceInput.select());
    </script>
